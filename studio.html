/* Look and feel taken from the website: navy, azure and purple, Libre Baskerville headings, Lato text, sharp corners, pill buttons, 3px purple card edge */
:root {
  --navy: #1b2b41; --azure: #00a8e8; --azure-ink: #0072a3; --purple: #5f4b8b; --purple-hover: #4d3c73;
  --ui-bg: #f9faf8; --ui-panel: #ffffff; --ui-line: #e2e8f0; --ui-text: #2d3748; --ui-muted: #4a5568;
  --ui-accent: #5f4b8b; --ui-accent-soft: #f0edf5; --ui-warn: #c53030; --ui-stage: #f0f4f8; --ui-head: #1b2b41;
  --ui-input: #94a3b8; --ui-ok: #166534; --ui-ring: rgba(0,168,232,.4); --ui-glass: rgba(255,255,255,.88);
  --ui-shadow: 0 8px 24px rgba(27,43,65,.08); --ui-on-accent: #ffffff;
  --serif: 'Studio Serif', 'Libre Baskerville', Georgia, serif; --sans: 'Studio Sans', Lato, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  font-family: var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) { --ui-bg: #0f1824; --ui-panel: #172334; --ui-line: #2a3a50; --ui-text: #dbe3ee; --ui-muted: #a3b0c2;
    --ui-accent: #a995d6; --ui-accent-soft: #261f3d; --ui-warn: #f59a9a; --ui-stage: #0b121c; --ui-head: #f1f5fa;
    --ui-input: #5b6b82; --ui-ok: #7fd49a; --ui-glass: rgba(23,35,52,.88); --ui-shadow: 0 8px 24px rgba(0,0,0,.4); --ui-on-accent: #14101f; --navy: #dbe3ee; --purple: #a995d6; --purple-hover: #bfaeea; }
}
:root[data-theme=dark] { --ui-bg: #0f1824; --ui-panel: #172334; --ui-line: #2a3a50; --ui-text: #dbe3ee; --ui-muted: #a3b0c2;
    --ui-accent: #a995d6; --ui-accent-soft: #261f3d; --ui-warn: #f59a9a; --ui-stage: #0b121c; --ui-head: #f1f5fa;
    --ui-input: #5b6b82; --ui-ok: #7fd49a; --ui-glass: rgba(23,35,52,.88); --ui-shadow: 0 8px 24px rgba(0,0,0,.4); --ui-on-accent: #14101f; --navy: #dbe3ee; --purple: #a995d6; --purple-hover: #bfaeea; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font-size: 14px; line-height: 1.45; height: 100vh; display: grid; grid-template-rows: auto 1fr; }
h1, h2, h3 { font-family: var(--serif); font-style: normal; color: var(--ui-head); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--ui-line); background: var(--ui-panel); border-radius: 4px; padding: 6px 12px; cursor: pointer; transition: border-color .15s, background .15s, transform .25s var(--ease), box-shadow .25s var(--ease); }
button:hover { border-color: var(--purple); }
button.primary { background: var(--purple); color: var(--ui-on-accent); border-color: var(--purple); border-radius: 100px; padding: 7px 18px; font-weight: 700; }
button.primary:hover { background: var(--purple-hover); border-color: var(--purple-hover); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(95,75,139,.35); }
button.pill { border: 2px solid var(--navy); color: var(--ui-head); background: transparent; border-radius: 100px; padding: 5px 16px; font-weight: 700; }
button.pill:hover { background: var(--navy); color: var(--ui-panel); border-color: var(--navy); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ui-ring); }
input[type=text], input[type=date], input[type=time], input[type=search], input[type=number], input[type=password], select, textarea {
  width: 100%; border: 1.5px solid var(--ui-input); background: var(--ui-panel); border-radius: 0; padding: 7px 9px; transition: border-color .15s, box-shadow .15s; }
input[type=text]:focus, input[type=date]:focus, input[type=time]:focus, input[type=search]:focus, input[type=number]:focus, input[type=password]:focus, select:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--ui-ring); }
textarea { resize: vertical; min-height: 60px; }

/* top bar */
header.topbar { display: flex; align-items: center; gap: 22px; padding: 0 20px; height: 58px; border-bottom: 1px solid var(--ui-line); background: var(--ui-glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); position: relative; z-index: 20; }
.brandmark { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--ui-head); white-space: nowrap; }
.brandmark i { width: 14px; height: 14px; background: var(--azure); box-shadow: 5px 5px 0 var(--purple); margin-right: 5px; }
nav.tabs { display: flex; gap: 6px; align-self: stretch; }
nav.tabs button { border: 0; border-radius: 0; background: none; padding: 0 12px; font-weight: 700; font-size: 14.4px; color: var(--ui-head); position: relative; }
nav.tabs button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 11px; height: 3px; background: var(--azure); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); }
nav.tabs button:hover::after, nav.tabs button[aria-selected=true]::after { transform: scaleX(1); }
nav.tabs button:hover { border: 0; }

  const r1 = (v) => Math.round(v * 10) / 10;
  d.p.image.fx = r1(d.nx); d.p.image.fy = r1(d.ny);
  if (d.corner) { d.p.image.fw = r1(d.nw); d.p.image.fh = r1(d.nh); }
  changed(); render();
});

/* ───────────────────────── wiring ───────────────────────── */
document.querySelectorAll('nav.tabs button').forEach((b) => b.addEventListener('click', () => { imageTarget = null; imgDelete = false; tab = b.dataset.tab; try { localStorage.setItem(LS.tab, tab); } catch { } render(); }));
$('#btnOpen').onclick = openFolder;

/* Light / dark: follow the computer by default, or pin one. Remembered in this browser only. */
const THEMES = [['auto', '◐', 'Colours: match my computer'], ['light', '☀', 'Colours: light'], ['dark', '☾', 'Colours: dark']];
let theme = 'auto';
try { theme = localStorage.getItem(LS.theme) || 'auto'; } catch { }
function applyTheme() {
  const [, glyph, label] = THEMES.find((t) => t[0] === theme) || THEMES[0];
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('#btnTheme').textContent = glyph; $('#btnTheme').title = label + ' (click to change)'; $('#btnTheme').setAttribute('aria-label', label);
}
$('#btnTheme').onclick = () => { theme = THEMES[(THEMES.findIndex((t) => t[0] === theme) + 1) % 3][0]; try { localStorage.setItem(LS.theme, theme); } catch { } applyTheme(); toast(THEMES.find((t) => t[0] === theme)[2].replace('Colours: ', 'Colours: ')); };
applyTheme();

/* Share: everything that gets a post out of the studio, in one place. */
const shareBtn = $('#btnShare'), shareMenu = $('#shareMenu');
function closeShare() { shareMenu.hidden = true; shareBtn.setAttribute('aria-expanded', 'false'); }
function openShare() {
  const p = ws && currentPost();
  shareMenu.textContent = '';
  const fb = h('textarea', { hidden: true, readonly: true, rows: 5, style: 'margin:6px 10px 2px;width:auto;font-size:12px' });
  const done = (fn) => async () => { await fn(); if (fb.hidden) closeShare(); };
  const item = (title, note, fn, off) => { const b = h('button', { class: 'item', role: 'menuitem', disabled: !!off, onclick: done(fn) }, h('b', {}, title), h('small', {}, note)); return b; };
  if (!p) shareMenu.append(h('div', { class: 'state' }, 'Pick or create a post first.'));
  else {
    const st = p.status, exported = ['exported', 'scheduled', 'published', 'failed'].includes(st), live = st === 'scheduled' || st === 'published';
    shareMenu.append(h('h4', {}, `Share “${p.fields.title || p.fields.big || p.id}”`),
      h('div', { class: 'state' }, live ? (st === 'published' ? 'Published ✓' : `Scheduled for ${p.date} ${p.time} ✓`) : `Status: ${st}`),
      st === 'idea' || st === 'draft' ? item('Approve', 'Happy with the words and the picture? Only you can approve.', () => { p.status = 'approved'; changed(); render(); toast('Approved. Now export the picture.'); }) : null,
      item('Export as PNG', (slideCount(p) > 1 ? `Saves one picture per slide (${slideCount(p)}) into the exports folder of your workspace.` : 'Saves the picture into the exports folder of your workspace.'), () => exportPost(p)),
      item('Copy the caption', p.caption ? 'Copies the caption text, ready to paste.' : 'This post has no caption yet.', () => copyText(p.caption, 'Caption copied.', fb), !p.caption),
      h('div', { class: 'sep' }),
      item(st === 'failed' ? 'Ask your AI to fix it' : 'Ask your AI to schedule it', live ? 'Already sent to PostProxy.' : exported ? 'Copies a message for your AI. It shows you a dry run before anything goes out.' : 'Export the PNG first.',
        () => copyText(schedulePrompt(p), 'Copied. Paste it to your AI.', fb), live || !exported), fb);
  }
  shareMenu.hidden = false; shareBtn.setAttribute('aria-expanded', 'true');
  shareMenu.querySelector('button:not(:disabled)')?.focus();
}
shareBtn.onclick = (e) => { e.stopPropagation(); shareMenu.hidden ? openShare() : closeShare(); };
document.addEventListener('click', (e) => { if (!shareMenu.hidden && !e.target.closest('.sharewrap')) closeShare(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !shareMenu.hidden) { closeShare(); shareBtn.focus(); } });
addEventListener('resize', renderStage);
(async function boot() {
  try { tab = localStorage.getItem(LS.tab) || 'posts'; } catch { }
  try { remembered = (await idb('readonly', (st) => st.get(HANDLE_KEY))) || null; } catch { }
  // Still allowed (same session, or "Allow on every visit"): open straight into this studio's folder.
  if (remembered && (await remembered.queryPermission({ mode: 'readwrite' }).catch(() => 'prompt')) === 'granted') return useFolder(remembered);
  showWelcome();
})();
</script>
